services:
  media-optimizer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saas-media-optimizer
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - MAX_FILE_SIZE_MB=25
      - MAX_IMAGE_DIMENSION=4000
      - API_KEY=${API_KEY:-}
      - RATE_LIMIT_WINDOW_MS=60000
      - RATE_LIMIT_MAX=60
      - MAX_CONCURRENT_JOBS=4
      - MAX_QUEUE_WAITING=10
      - LOG_RETENTION_DAYS=30
      - LOG_LEVEL=info
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 1024M
