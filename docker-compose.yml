services:
  media-optimizer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saas-media-optimizer
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - MAX_FILE_SIZE_MB=25
      - MAX_IMAGE_DIMENSION=4000
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 1024M
